version: '3.8'

services:
  client:
    build:
      context: ./client
    ports:
      - "5173:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/creators_platform
      - POSTGRES_URI=postgresql://user:pass@postgres:5432/creators_platform
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_here
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongo
      - postgres
      - redis

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=creators_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  postgres_data:
